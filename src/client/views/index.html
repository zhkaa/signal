<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Signal — ясность для вашего контента</title>
    <meta
      name="description"
      content="Signal: исследование ниш YouTube, сравнение каналов и подготовка публикаций в одном рабочем пространстве."
    />
    <link rel="icon" href="/assets/signal-logo.svg" />
    <link rel="stylesheet" href="/css/main.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body x-data="signal" @keydown.escape.window="mobile=false">
    <a
      class="skip-link"
      :href="shell === 'app' ? '#workspace-main' : isAuth ? '#auth-main' : '#main-content'"
      x-text="t('skip')"
    ></a>
    <div class="boot" x-show="!ready" role="status">
      <a class="brand" href="/" @click="link($event, '/')">
        <svg viewBox="0 0 32 32" aria-hidden="true" class="brand-mark">
          <path
            d="M4 21V11m8 15V6m8 18V8m8 13V11"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
        <span>
          signal
          <span class="brand-dot">.</span>
        </span>
      </a>
      <span class="spinner"></span>
      <span x-text="t('busy')"></span>
    </div>
    <div x-show="ready" x-cloak>
      <div class="global-banner" x-show="announcement" x-text="announcement"></div>
      <div class="offline-banner" role="status" x-show="!online" x-text="t('offline')"></div>
      <!-- include: pages/landing.html -->
      <!-- include: pages/auth.html -->
      <!-- include: pages/workspace.html -->
      <section class="route-error container" x-show="page==='notFound'">
        <h1 x-text="t('notFound')"></h1>
        <p x-text="t('notFoundText')"></p>
        <a href="/" class="button" @click="link($event,'/')" x-text="t('backHome')"></a>
      </section>
    </div>
    <dialog
      x-ref="deleteDialog"
      class="confirm-dialog"
      aria-labelledby="delete-title"
      aria-describedby="delete-description"
      @cancel="if(busy)$event.preventDefault()"
    >
      <h2 id="delete-title" x-text="t('deleteTitle')"></h2>
      <p class="project-delete-name" x-text="deleteTarget?.title"></p>
      <p id="delete-description" x-text="t('deleteBody')"></p>
      <p class="feedback error" role="alert" x-show="dialogError" x-text="t(dialogError)"></p>
      <div class="dialog-actions">
        <button
          class="button outline"
          x-ref="cancelDelete"
          autofocus
          :disabled="busy"
          @click="$refs.deleteDialog.close()"
          x-text="t('cancel')"
        ></button>
        <button class="button danger" :disabled="busy" :aria-busy="busy" @click="deleteProject()">
          <span x-show="busy" class="spinner"></span>
          <span x-text="t('delete')"></span>
        </button>
      </div>
    </dialog>
  </body>
</html>
